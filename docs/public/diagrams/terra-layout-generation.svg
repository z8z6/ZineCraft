<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Zinecraft 国家、城市与 Region 生成链路</title>
  <desc id="desc">从国家定位折线、两级 Voronoi、移动地块到 Region 四层结构及运行时放置。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#202b34"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#f0b429"/></marker>
    <style>
      .title{font:700 30px 'Microsoft YaHei',sans-serif;fill:#f6f1e8}.sub{font:15px 'Microsoft YaHei',sans-serif;fill:#aeb9c2}
      .step{font:700 17px 'Microsoft YaHei',sans-serif;fill:#f6f1e8}.note{font:14px 'Microsoft YaHei',sans-serif;fill:#c9d0d6}
      .code{font:13px Consolas,monospace;fill:#f0b429}.panel{fill:#182129;stroke:#46535e;stroke-width:2}
      .bound{fill:none;stroke:#d7dfe4;stroke-width:2}.flow{fill:none;stroke:#f0b429;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="650" rx="18" fill="url(#bg)"/><rect width="12" height="650" fill="#f0b429"/>
  <text x="54" y="58" class="title">国家 → 城市 → Region → 世界结构</text><text x="54" y="87" class="sub">稳定声明经过 Voronoi、候选搜索与分层道路规划，转换为可复现的世界布局</text>
  <g transform="translate(54 122)"><rect class="panel" width="245" height="215" rx="12"/><text x="18" y="32" class="step">1  国家定位折线</text><text x="18" y="55" class="code">position(x, z)</text><rect x="20" y="72" width="205" height="110" class="bound"/><polyline points="43,155 82,118 120,137" fill="none" stroke="#ef6c42" stroke-width="5"/><polyline points="135,96 170,116 202,82" fill="none" stroke="#72b7df" stroke-width="5"/><g fill="#ef6c42"><circle cx="43" cy="155" r="5"/><circle cx="82" cy="118" r="5"/><circle cx="120" cy="137" r="5"/></g><g fill="#72b7df"><circle cx="135" cy="96" r="5"/><circle cx="170" cy="116" r="5"/><circle cx="202" cy="82" r="5"/></g><text x="18" y="203" class="note">站点折线，不是边界顶点</text></g>
  <path class="flow" d="M312 230H345"/>
  <g transform="translate(360 122)"><rect class="panel" width="245" height="215" rx="12"/><text x="18" y="32" class="step">2  两级 Voronoi</text><text x="18" y="55" class="note">先国家，后国家内的城市</text><path d="M25 75H220V182H25Z" class="bound"/><path d="M25 75H114L100 122L25 149Z" fill="#503b32" stroke="#ef6c42" stroke-width="2"/><path d="M114 75H220V140L100 122Z" fill="#294c5c" stroke="#72b7df" stroke-width="2"/><path d="M25 149L100 122L220 140V182H25Z" fill="#3f4934" stroke="#9bbb72" stroke-width="2"/><circle cx="52" cy="149" r="4" fill="#fff"/><circle cx="84" cy="169" r="4" fill="#fff"/><text x="18" y="203" class="note">所有站点共同决定邻接边界</text></g>
  <path class="flow" d="M618 230H651"/>
  <g transform="translate(666 122)"><rect class="panel" width="245" height="215" rx="12"/><text x="18" y="32" class="step">3  城市移动地块</text><text x="18" y="55" class="note">Chunk 对齐、评分、道路连接</text><path d="M28 80L208 69L225 174L58 188L20 137Z" class="bound"/><rect x="77" y="101" width="56" height="42" fill="#2c6570" stroke="#7ec4ca"/><rect x="145" y="88" width="58" height="45" fill="#654b65" stroke="#c89bc8"/><rect x="75" y="155" width="70" height="22" fill="#625b35" stroke="#d0bd62"/><rect x="133" y="113" width="12" height="10" fill="#68747e"/><rect x="102" y="143" width="12" height="12" fill="#68747e"/><circle cx="105" cy="122" r="7" fill="#f0b429"/><text x="18" y="203" class="note">核心区靠内，郊区向外扩张</text></g>
  <path class="flow" d="M924 230H957"/>
  <g transform="translate(972 122)"><rect class="panel" width="174" height="215" rx="12"/><text x="15" y="32" class="step">4  四层 Region</text><g transform="translate(18 73)"><polygon points="0,82 91,54 138,71 47,101" fill="#6d7440" stroke="#d0bd62"/><polygon points="0,59 91,31 138,48 47,78" fill="#3e6570" stroke="#7ec4ca"/><polygon points="0,36 91,8 138,25 47,55" fill="#534964" stroke="#c89bc8"/><polygon points="0,13 91,-15 138,2 47,32" fill="#6a463d" stroke="#ef8b6b"/><path d="M69 3V72" stroke="#f0b429" stroke-width="5"/></g><text x="15" y="188" class="note">道路独立，楼梯对齐</text><text x="15" y="207" class="code">0 / 16 / 32 / 48</text></g>
  <g transform="translate(54 380)"><rect class="panel" width="1092" height="215" rx="12"/><text x="22" y="37" class="step">5  离线导出 → 运行时按 Chunk 放置</text><rect x="35" y="68" width="230" height="93" rx="9" fill="#222f38" stroke="#65737e"/><text x="55" y="98" class="step">确定性计算</text><text x="55" y="125" class="code">TerraLayoutCalculator</text><text x="55" y="146" class="code">RegionLayoutValidator</text><path class="flow" d="M280 115H345"/><rect x="360" y="68" width="250" height="93" rx="9" fill="#222f38" stroke="#65737e"/><text x="380" y="98" class="step">schema v16 / gzip</text><text x="380" y="125" class="code">index.json.gz</text><text x="380" y="146" class="code">nations/&lt;id&gt;.json.gz</text><path class="flow" d="M625 115H690"/><rect x="705" y="68" width="342" height="93" rx="9" fill="#222f38" stroke="#65737e"/><text x="725" y="98" class="step">新区块生成</text><text x="725" y="125" class="code">MobilePlotStructurePlacement</text><text x="725" y="146" class="note">道路 / 楼梯 / 分层构件 / 建筑</text><text x="35" y="193" class="note">意图：全图一致、结果可复现、运行时开销可控；代价：上游点位变化会引起较大范围重新计算。</text></g>
</svg>
