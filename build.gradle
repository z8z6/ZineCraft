import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

import java.util.zip.ZipFile

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id "org.jetbrains.kotlin.jvm" version "2.3.21"
    id 'maven-publish'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.minecraftforge.net/" }
    mavenCentral()
    mavenLocal()
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.ladysnake.org/releases" }
    maven { url "https://maven.ryanliptak.com/" }
    maven { url "https://www.cursemaven.com" }
    maven { url "https://maven.createmod.net" }
    maven { url "https://maven.blamejared.com/" }
    maven { url "https://maven.ftb.dev/releases" }
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "zinecraft" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
        modId = "zinecraft"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    include implementation("org.luaj:luaj-jse:${project.luaj_version}")
    testImplementation "org.jetbrains.kotlin:kotlin-test"

    modImplementation "com.github.glitchfiend:TerraBlender-fabric:${terra_blender_version}"
    modImplementation "dev.emi:trinkets:${trinkets_version}"
    modImplementation "net.createmod.ponder:Ponder-Fabric-${minecraft_version}:${ponder_version}"
    modImplementation "dev.ftb.mods:ftb-quests-fabric:${project.ftb_quests_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    modLocalRuntime "curse.maven:advanced-loot-info-1205426:${advanced_loot_info_version}"
    modLocalRuntime "squeek.appleskin:appleskin-fabric:mc${appleskin_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}+fabric"

}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
}

javadoc {
    options.locale = "zh_CN"
    options.encoding = "UTF-8"
}

tasks.register('verifyCollectibleJarResources') {
    group = 'verification'
    description = 'Verifies that every imported collectible has its runtime resources in the remapped JAR.'
    dependsOn tasks.named('remapJar')

    doLast {
        def archive = tasks.named('remapJar').get().archiveFile.get().asFile
        new ZipFile(archive).withCloseable { zip ->
            def readJson = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Missing JAR resource: ${path}")
                zip.getInputStream(entry).withCloseable { stream ->
                    new JsonSlurper().parse(new InputStreamReader(stream, 'UTF-8'))
                }
            }
            def catalog = readJson('zinecraft/collectibles/phantom_crimson_solitaire.json')
            if (catalog.size() != 245) {
                throw new GradleException("Expected 245 collectibles in JAR catalog, found ${catalog.size()}")
            }
            ['path', 'orderId', 'sourceId', 'iconId'].each { field ->
                def values = catalog.collect { it[field] }
                if (values.any { it == null } || values.size() != (values as Set).size()) {
                    throw new GradleException("Collectible catalog field is missing or duplicated: ${field}")
                }
            }
            def tag = readJson('data/trinkets/tags/item/chest/relic.json')
            def zhCn = readJson('assets/zinecraft/lang/zh_cn.json')
            def enUs = readJson('assets/zinecraft/lang/en_us.json')
            def expectedTagValues = catalog.collect { "zinecraft:${it.path}".toString() } as Set
            if (tag.values.size() != (tag.values as Set).size()) {
                throw new GradleException('Trinkets relic tag contains duplicate values')
            }
            if ((tag.values as Set) != expectedTagValues) {
                throw new GradleException('Trinkets relic tag does not exactly match the collectible catalog')
            }
            catalog.each { collectible ->
                def path = collectible.path
                def modelPath = "assets/zinecraft/models/item/${path}.json".toString()
                def texturePath = "assets/zinecraft/textures/item/${path}.png".toString()
                if (zip.getEntry(texturePath) == null) throw new GradleException("Missing JAR resource: ${texturePath}")
                def model = readJson(modelPath)
                if (model.textures?.layer0 != "zinecraft:item/${path}".toString()) {
                    throw new GradleException("Collectible model references wrong texture: ${modelPath}")
                }
                def translationKey = "item.zinecraft.${path}".toString()
                ['', '.original_effect', '.description', '.minecraft_effect'].each { suffix ->
                    def key = "${translationKey}${suffix}".toString()
                    if (!zhCn.containsKey(key) || !enUs.containsKey(key)) {
                        throw new GradleException("Missing collectible translation: ${key}")
                    }
                }
                ['original_effect', 'description'].each { field ->
                    def prefix = "${translationKey}.${field}.".toString()
                    def zhLineKeys = zhCn.keySet().findAll { it.startsWith(prefix) && it.substring(prefix.length()) ==~ /[0-9]+/ } as Set
                    def enLineKeys = enUs.keySet().findAll { it.startsWith(prefix) && it.substring(prefix.length()) ==~ /[0-9]+/ } as Set
                    if (zhLineKeys.isEmpty() || zhLineKeys != enLineKeys) {
                        throw new GradleException("Missing or mismatched tooltip line translations: ${prefix}*")
                    }
                    def expectedLines = (0..<zhLineKeys.size()).collect { "${prefix}${it}".toString() } as Set
                    if (zhLineKeys != expectedLines) {
                        throw new GradleException("Tooltip line translations are not contiguous: ${prefix}*")
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCollectibleJarResources')
}
