import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.security.MessageDigest
import java.util.jar.Manifest
import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.createmod.net/' }
    maven { url 'https://maven.ithundxr.dev/snapshots' }
    maven { url 'https://maven.ftb.dev/releases' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.theillusivec4.top/' }
    maven { url 'https://www.cursemaven.com' }
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'FirstDarkSnapshots'
                url = 'https://maven.firstdark.dev/snapshots'
            }
        }
        filter { includeGroupByRegex 'com\\.lowdragmc\\..*' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.MICROSOFT
    }
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/client/java']
        resources.srcDirs = ['src/main/resources', 'src/client/resources', 'src/generated/resources']
    }
    // ModDev puts *AdditionalRuntimeClasspath dependencies on NeoForge's legacy
    // library classpath. Regular mod jars on that classpath are not discovered as
    // mods, so the client run needs its own normal runtime classpath instead.
    clientRuntime {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

def terraLayoutValidationDir = layout.buildDirectory.dir('reports/terra-layout')
def terraLayoutValidationJson = terraLayoutValidationDir.map { it.file('terra_layout.json') }
def terraLayoutValidationMap = terraLayoutValidationDir.map { it.file('terra_layout_map.svg') }
def terraTerrainHeightmapFile = layout.buildDirectory.file('reports/terra-terrain/heightmap.json')
def terraTerrainDatagenDirectory = layout.buildDirectory.dir('terra-terrain-datagen')
def terraTerrainSeed = providers.gradleProperty('terraTerrainSeed').orElse('-8732947949389768645')
def terraTerrainSpacing = providers.gradleProperty('terraTerrainSpacing').orElse('2048')

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            sourceSet = sourceSets.clientRuntime
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            systemProperty 'zinecraft.terraLayoutReport', terraLayoutValidationJson.get().asFile.absolutePath
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
        terrainHeightData {
            data()
            systemProperty 'zinecraft.terraLayoutReport', terraLayoutValidationJson.get().asFile.absolutePath
            systemProperty 'zinecraft.terraTerrainHeightmap', terraTerrainHeightmapFile.get().asFile.absolutePath
            systemProperty 'zinecraft.terraTerrainSeed', terraTerrainSeed.get()
            systemProperty 'zinecraft.terraTerrainSpacing', terraTerrainSpacing.get()
            programArguments.addAll '--mod', project.mod_id, '--server', '--output',
                    terraTerrainDatagenDirectory.get().asFile.absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        zinecraft {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('runTerrainHeightData') {
    inputs.property 'terraTerrainSeed', terraTerrainSeed
    inputs.property 'terraTerrainSpacing', terraTerrainSpacing
    outputs.file terraTerrainHeightmapFile
}

tasks.register('generateTerraTerrainHeightmap') {
    group = 'data generation'
    description = 'Samples Terra terrain height at fixed-seed grid centers; not part of runData.'
    dependsOn tasks.named('runTerrainHeightData')
}

tasks.register('generateTerraLayoutValidation', Exec) {
    group = 'verification'
    description = 'Exports the Terra Nation/City/Region layout JSON and renders its SVG validation map.'
    dependsOn tasks.named('runData')
    workingDir projectDir
    commandLine 'python', 'script/plot_terra_layout.py',
            '--input', terraLayoutValidationJson.get().asFile.absolutePath,
            '--output', terraLayoutValidationMap.get().asFile.absolutePath
    inputs.file(terraLayoutValidationJson)
    inputs.file('script/plot_terra_layout.py')
    outputs.file(terraLayoutValidationMap)
}

