    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Segment-site Voronoi topology for Nation polyline skeletons. Pinned for reproducible geometry.
    compileOnly 'com.github.micycle1.jOpenVoronoi:jopenvoronoi-core:2f6d4ca'
    compileOnly 'org.locationtech.jts:jts-core:1.20.0'
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${project.terra_blender_version}"
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:${project.flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    implementation "dev.ftb.mods:ftb-quests-neoforge:${project.ftb_quests_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    implementation "curse.maven:l2library-620203:${project.l2library_file_id}"

    // Optional development conveniences; they are available in runClient but are not production requirements.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
    compileOnly "maven.modrinth:uEfK2CXF:${project.jer_modrinth_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${project.journeymap_api_version}"
    runtimeOnly "maven.modrinth:EsAfCjCV:${project.appleskin_modrinth_version}"
    runtimeOnly "maven.modrinth:uEfK2CXF:${project.jer_modrinth_version}"
    runtimeOnly "maven.modrinth:jade:${project.jade_version}+neoforge"
    runtimeOnly "maven.modrinth:justenoughcharacters:${project.just_enough_characters_version}"
    runtimeOnly "maven.modrinth:journeymap:${project.journeymap_version}"
    runtimeOnly "maven.modrinth:fPetb5Kh:${project.natures_compass_modrinth_version}"
    runtimeOnly "maven.modrinth:RV1qfVQ8:${project.explorers_compass_modrinth_version}"
    runtimeOnly "maven.modrinth:tooltip-overhaul:${project.tooltip_overhaul_modrinth_version}"
    // MmmMmmMmmMmm target dummy is available on both client and dedicated server.
    runtimeOnly "maven.modrinth:twkfQtEc:${project.moonlight_modrinth_version}"
    runtimeOnly "maven.modrinth:Adega8YN:${project.target_dummy_modrinth_version}"
    clientAdditionalRuntimeClasspath "maven.modrinth:aC3cM3Vq:${project.mouse_tweaks_modrinth_version}"
    // Sodium declares FMLModType=LIBRARY and is discovered from the client-only legacy classpath.
    clientAdditionalRuntimeClasspath "maven.modrinth:sodium:${project.sodium_modrinth_version}"
    // Client menu customization and world-loading tips, including their required libraries.
    clientRuntimeRuntimeOnly "maven.modrinth:fancymenu:" + project.fancymenu_modrinth_version
    clientRuntimeRuntimeOnly "maven.modrinth:melody:" + project.melody_modrinth_version
    clientRuntimeRuntimeOnly "maven.modrinth:konkrete:" + project.konkrete_modrinth_version
    clientRuntimeRuntimeOnly "maven.modrinth:tips:" + project.tips_modrinth_version
    clientRuntimeRuntimeOnly "maven.modrinth:bookshelf-lib:" + project.bookshelf_modrinth_version
    clientRuntimeRuntimeOnly "maven.modrinth:prickle:" + project.prickle_modrinth_version
    // TaCZ owns gun items, gun-pack loading, rendering, input and mechanical animations.
    implementation "maven.modrinth:tacz-1.21.1:${project.tacz_version}"

    // Development-time VFX authoring and Java integration.
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraft_version}:${project.ldlib2_version}:all"
    implementation("com.lowdragmc.photon:photon-neoforge-${project.minecraft_version}:${project.photon_version}") {
        transitive = false
    }

}

def generateTerraLayoutData = tasks.register('generateTerraLayoutData', JavaExec) {
    group = 'data generation'
    description = 'Calculates Terra boundaries outside the NeoForge module layer and exports JSON.'
    dependsOn tasks.named('compileJava')
    def generatorWorkingDir = layout.buildDirectory.dir('terra-layout-generator')
    workingDir generatorWorkingDir
    doFirst {
        generatorWorkingDir.get().asFile.mkdirs()
    }
    classpath = files(
            sourceSets.main.output.classesDirs,
            sourceSets.main.compileClasspath,
            fileTree(layout.buildDirectory.dir('moddev/artifacts')) {
                include '*client-extra*.jar'
            }
    )
    mainClass = 'com.cxxcxx.zinecraft.core.datagen.TerraLayoutDataExporter'
    args file('src/generated/resources/data/zinecraft/terra_layout').absolutePath,
            terraLayoutValidationJson.get().asFile.absolutePath
    inputs.files(sourceSets.main.allJava)
    outputs.dir file('src/generated/resources/data/zinecraft/terra_layout')
    outputs.file terraLayoutValidationJson
}

tasks.named('processResources') {
    dependsOn generateTerraLayoutData
    exclude 'data/zinecraft/terra_layout.json'
}

tasks.named('sourcesJar') {
    dependsOn generateTerraLayoutData
    exclude 'data/zinecraft/terra_layout.json'
}

def restoreTerraLayoutData = tasks.register('restoreTerraLayoutData', JavaExec) {
    group = 'data generation'
    description = 'Restores compressed Terra layout resources removed by the NeoForge data HashCache.'
    dependsOn tasks.named('compileJava')
    def generatorWorkingDir = layout.buildDirectory.dir('terra-layout-generator')
    workingDir generatorWorkingDir
    doFirst {
        generatorWorkingDir.get().asFile.mkdirs()
    }
    classpath = files(
            sourceSets.main.output.classesDirs,
            sourceSets.main.compileClasspath,
            fileTree(layout.buildDirectory.dir('moddev/artifacts')) {
                include '*client-extra*.jar'
            }
    )
    mainClass = 'com.cxxcxx.zinecraft.core.datagen.TerraLayoutDataExporter'
    args file('src/generated/resources/data/zinecraft/terra_layout').absolutePath,
            terraLayoutValidationJson.get().asFile.absolutePath
}

tasks.named('runData') {
    dependsOn generateTerraLayoutData
    // NeoForge HashCache removes files in the shared generated-resource directory
    // that are not emitted by one of its providers. Recreate the independently
    // generated compressed Terra layout after vanilla/NeoForge data generation.
    finalizedBy restoreTerraLayoutData
}

