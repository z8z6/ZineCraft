import groovy.json.JsonSlurper

import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url 'https://maven.createmod.net/' }
    maven { url 'https://maven.ithundxr.dev/snapshots' }
    maven { url 'https://maven.ftb.dev/releases' }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.theillusivec4.top/' }
    maven { url 'https://www.cursemaven.com' }
    maven { url 'https://maven.blamejared.com/' }
    maven { url 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/client/java']
        resources.srcDirs = ['src/main/resources', 'src/client/resources', 'src/generated/resources']
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        zinecraft {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${project.terra_blender_version}"
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:${project.flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    implementation "dev.ftb.mods:ftb-quests-neoforge:${project.ftb_quests_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"

    // Optional development conveniences; they are available in runClient but are not production requirements.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
    compileOnly "maven.modrinth:uEfK2CXF:${project.jer_modrinth_version}"
    runtimeOnly "maven.modrinth:EsAfCjCV:${project.appleskin_modrinth_version}"
    runtimeOnly "maven.modrinth:uEfK2CXF:${project.jer_modrinth_version}"
    runtimeOnly "maven.modrinth:jade:${project.jade_version}+neoforge"
    runtimeOnly "maven.modrinth:justenoughcharacters:${project.just_enough_characters_version}"
    runtimeOnly "maven.modrinth:journeymap:${project.journeymap_version}"
    runtimeOnly "maven.modrinth:fPetb5Kh:${project.natures_compass_modrinth_version}"
    runtimeOnly "maven.modrinth:RV1qfVQ8:${project.explorers_compass_modrinth_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xmaxerrs')
    options.compilerArgs.add('1000')
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

jar {
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

tasks.register('verifyCollectibleJarResources') {
    group = 'verification'
    description = 'Verifies that every imported collectible has its runtime resources in the JAR.'
    dependsOn tasks.named('jar')

    doLast {
        def archive = tasks.named('jar').get().archiveFile.get().asFile
        new ZipFile(archive).withCloseable { zip ->
            def readJson = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Missing JAR resource: ${path}")
                zip.getInputStream(entry).withCloseable { stream ->
                    new JsonSlurper().parse(new InputStreamReader(stream, 'UTF-8'))
                }
            }
            def catalog = readJson('zinecraft/collectibles/phantom_crimson_solitaire.json')
            if (catalog.size() != 245) {
                throw new GradleException("Expected 245 collectibles in JAR catalog, found ${catalog.size()}")
            }
            ['path', 'orderId', 'sourceId', 'iconId'].each { field ->
                def values = catalog.collect { it[field] }
                if (values.any { it == null } || values.size() != (values as Set).size()) {
                    throw new GradleException("Collectible catalog field is missing or duplicated: ${field}")
                }
            }
            def zhCn = readJson('assets/zinecraft/lang/zh_cn.json')
            def enUs = readJson('assets/zinecraft/lang/en_us.json')
            catalog.each { collectible ->
                def path = collectible.path
                if (zip.getEntry("assets/zinecraft/textures/item/${path}.png") == null) {
                    throw new GradleException("Missing collectible texture: ${path}")
                }
                def model = readJson("assets/zinecraft/models/item/${path}.json")
                if (model.textures?.layer0 != "zinecraft:item/${path}".toString()) {
                    throw new GradleException("Collectible model references wrong texture: ${path}")
                }
                def translationKey = "item.zinecraft.${path}".toString()
                ['', '.original_effect', '.description', '.minecraft_effect'].each { suffix ->
                    def key = "${translationKey}${suffix}".toString()
                    if (!zhCn.containsKey(key) || !enUs.containsKey(key)) {
                        throw new GradleException("Missing collectible translation: ${key}")
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCollectibleJarResources')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
