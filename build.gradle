    compileOnly 'com.github.micycle1.jOpenVoronoi:jopenvoronoi-core:2f6d4ca'
    compileOnly 'org.locationtech.jts:jts-core:1.20.0'
    implementation "com.github.glitchfiend:TerraBlender-neoforge:${project.terra_blender_version}"
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") {
        transitive = false
    }
    implementation "net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${project.minecraft_version}:${project.flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    implementation "dev.ftb.mods:ftb-quests-neoforge:${project.ftb_quests_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
    implementation "curse.maven:l2library-620203:${project.l2library_file_id}"

    // Optional development conveniences; they are available in runClient but are not production requirements.
    compileOnly "mezz.jei:jei-${project.minecraft_version}-neoforge-api:${project.jei_version}"
    runtimeOnly "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"
    compileOnly "maven.modrinth:uEfK2CXF:${project.jer_modrinth_version}"
    compileOnly "info.journeymap:journeymap-api-neoforge:${project.journeymap_api_version}"
    runtimeOnly "maven.modrinth:EsAfCjCV:${project.appleskin_modrinth_version}"
    runtimeOnly "maven.modrinth:uEfK2CXF:${project.jer_modrinth_version}"
    runtimeOnly "maven.modrinth:jade:${project.jade_version}+neoforge"
    runtimeOnly "maven.modrinth:justenoughcharacters:${project.just_enough_characters_version}"
    runtimeOnly "maven.modrinth:journeymap:${project.journeymap_version}"
    runtimeOnly "maven.modrinth:fPetb5Kh:${project.natures_compass_modrinth_version}"
    runtimeOnly "maven.modrinth:RV1qfVQ8:${project.explorers_compass_modrinth_version}"
    runtimeOnly "maven.modrinth:tooltip-overhaul:${project.tooltip_overhaul_modrinth_version}"
    // MmmMmmMmmMmm target dummy is available on both client and dedicated server.
    runtimeOnly "maven.modrinth:twkfQtEc:${project.moonlight_modrinth_version}"
    runtimeOnly "maven.modrinth:Adega8YN:${project.target_dummy_modrinth_version}"
    clientAdditionalRuntimeClasspath "maven.modrinth:aC3cM3Vq:${project.mouse_tweaks_modrinth_version}"
    // Sodium declares FMLModType=LIBRARY and is discovered from the client-only legacy classpath.
    clientAdditionalRuntimeClasspath "maven.modrinth:sodium:${project.sodium_modrinth_version}"
    // Iris is client-only and requires Sodium; keep it out of server and data-generator runs.
    clientAdditionalRuntimeClasspath "maven.modrinth:YL57xq9U:${project.iris_modrinth_version}"
    // TaCZ owns gun items, gun-pack loading, rendering, input and mechanical animations.
    implementation "maven.modrinth:tacz-1.21.1:${project.tacz_version}"

    // Development-time VFX authoring and Java integration.
    implementation "com.lowdragmc.ldlib2:ldlib2-neoforge-${project.minecraft_version}:${project.ldlib2_version}:all"
    implementation("com.lowdragmc.photon:photon-neoforge-${project.minecraft_version}:${project.photon_version}") {
        transitive = false
    }

}

def generateTerraLayoutData = tasks.register('generateTerraLayoutData', JavaExec) {
    group = 'data generation'
    description = 'Calculates Terra boundaries outside the NeoForge module layer and exports JSON.'
    dependsOn tasks.named('compileJava')
    def generatorWorkingDir = layout.buildDirectory.dir('terra-layout-generator')
    workingDir generatorWorkingDir
    doFirst {
        generatorWorkingDir.get().asFile.mkdirs()
    }
    classpath = files(
            sourceSets.main.output.classesDirs,
            sourceSets.main.compileClasspath,
            fileTree(layout.buildDirectory.dir('moddev/artifacts')) {
                include '*client-extra*.jar'
            }
    )
    mainClass = 'com.cxxcxx.zinecraft.core.datagen.TerraLayoutDataExporter'
    args file('src/generated/resources/data/zinecraft/terra_layout.json').absolutePath,
            terraLayoutValidationJson.get().asFile.absolutePath
    inputs.files(sourceSets.main.allJava)
    outputs.files(
            file('src/generated/resources/data/zinecraft/terra_layout.json'),
            terraLayoutValidationJson
    )
}

tasks.named('processResources') {
    dependsOn generateTerraLayoutData
}

tasks.named('sourcesJar') {
    dependsOn generateTerraLayoutData
}

tasks.named('runData') {
    dependsOn generateTerraLayoutData
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs.add('-Xmaxerrs')
    options.compilerArgs.add('1000')
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version             : mod_version,
            tooltip_overhaul_version: tooltip_overhaul_version,
            tacz_version: tacz_version,
            journeymap_version_range: journeymap_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def archiveProjectName = project.name

jar {
    from('LICENSE') {
        rename { "${it}_${archiveProjectName}" }
    }
}

def releaseJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }

tasks.register('verifyCollectibleJarResources') {
    group = 'verification'
    description = 'Verifies that every Java-registered collectible has its runtime resources in the JAR.'
    dependsOn tasks.named('jar')

    doLast {
        def archive = releaseJarFile.get().asFile
        new ZipFile(archive).withCloseable { zip ->
            def legacyCatalogPath = 'zinecraft/collectibles/phantom_crimson_solitaire.json'
            if (zip.getEntry(legacyCatalogPath) != null) {
                throw new GradleException("Legacy runtime collectible catalog must not be packaged: ${legacyCatalogPath}")
            }
            def readJson = { String path ->
                def entry = zip.getEntry(path)
                if (entry == null) throw new GradleException("Missing JAR resource: ${path}")
                zip.getInputStream(entry).withCloseable { stream ->
                    new JsonSlurper().parse(new InputStreamReader(stream, 'UTF-8'))
                }
            }
            def zhCn = readJson('assets/zinecraft/lang/zh_cn.json')
            def enUs = readJson('assets/zinecraft/lang/en_us.json')
            def relicTag = readJson('data/curios/tags/item/relic.json')
            def paths = relicTag.values.collect { value ->
                if (!(value instanceof String) || !value.startsWith('zinecraft:')) {
                    throw new GradleException("Invalid collectible tag entry: ${value}")
                }
                value.substring('zinecraft:'.length())
            }.sort()
            if (paths.size() != 245) {
                throw new GradleException("Expected 245 Java-registered collectibles, found ${paths.size()}")
            }
            if (paths.size() != paths.toSet().size()) {
                throw new GradleException('Collectible tag paths must be unique')
            }
            paths.each { path ->
                if (path.startsWith('collectible_')) {
                    throw new GradleException("Legacy collectible path prefix is forbidden: ${path}")
                }
                if (zip.getEntry("assets/zinecraft/textures/item/${path}.png") == null) {
                    throw new GradleException("Missing collectible texture: ${path}")
                }
                def model = readJson("assets/zinecraft/models/item/${path}.json")
                if (model.textures?.layer0 != "zinecraft:item/${path}".toString()) {
                    throw new GradleException("Collectible model references wrong texture: ${path}")
                }
                def translationKey = "item.zinecraft.${path}".toString()
                ['', '.original_effect', '.description', '.minecraft_effect'].each { suffix ->
                    def key = "${translationKey}${suffix}".toString()
                    if (!zhCn.containsKey(key) || !enUs.containsKey(key)) {
                        throw new GradleException("Missing collectible translation: ${key}")
                    }
                }
            }
        }
    }
}

tasks.register('verifyMusicDiscJarResources') {
    group = 'verification'
    description = 'Verifies that every registered music disc model and texture is present in the JAR.'
    dependsOn tasks.named('jar')

    doLast {
        def archive = releaseJarFile.get().asFile
        new ZipFile(archive).withCloseable { zip ->
            ['pictures_of_the_past', 'random_gods', 'stranger_think'].each { path ->
                def modelPath = "assets/zinecraft/models/item/${path}.json"
                def texturePath = "assets/zinecraft/textures/item/${path}.png"
                if (zip.getEntry(modelPath) == null) {
                    throw new GradleException("Missing music disc model: ${modelPath}")
                }
                if (zip.getEntry(texturePath) == null) {
                    throw new GradleException("Missing music disc texture: ${texturePath}")
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyCollectibleJarResources')
    dependsOn tasks.named('verifyMusicDiscJarResources')
}

def pclStageDirectory = layout.buildDirectory.dir("pcl/Zinecraft-PCL-${project.mod_version}")
def pclArchive = layout.buildDirectory.file("distributions/Zinecraft-PCL-${project.mod_version}.zip")

tasks.register('preparePclPackage') {
    group = 'distribution'
    description = 'Stages a PCL-compatible pack with the current client configs and key bindings.'
    dependsOn tasks.named('build')
    outputs.dir(pclStageDirectory)
    // Packaging is also a snapshot operation: always pick up the latest local
    // key bindings, mod configs and JourneyMap UI settings from run/.
    outputs.upToDateWhen { false }

    doLast {
        def stage = pclStageDirectory.get().asFile
        delete stage
        def overrides = new File(stage, 'overrides')
        def modsDirectory = new File(overrides, 'mods')
        modsDirectory.mkdirs()

        def isDistributableMod = { File candidate ->
            if (!candidate.isFile() || !candidate.name.toLowerCase(Locale.ROOT).endsWith('.jar')) return false
            def lowerName = candidate.name.toLowerCase(Locale.ROOT)
            if (lowerName.startsWith('neoforge-')
                    || lowerName.contains('client-extra')
                    || lowerName.startsWith('minecraft-')
                    || lowerName.startsWith('devlaunch-')) return false
            def accepted = false
            try {
                new ZipFile(candidate).withCloseable { zip ->
                    accepted = zip.getEntry('META-INF/neoforge.mods.toml') != null
                            || zip.getEntry('META-INF/mods.toml') != null
                    if (!accepted) {
                        def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
                        if (manifestEntry != null) {
                            zip.getInputStream(manifestEntry).withCloseable { stream ->
                                def type = new Manifest(stream).mainAttributes.getValue('FMLModType')
                                accepted = type in ['GAMELIBRARY', 'LIBRARY']
                            }
                        }
                    }
                }
            } catch (Exception ignored) {
                accepted = false
            }
            return accepted
        }

        def runtimeFiles = [
                configurations.runtimeClasspath,
                configurations.clientAdditionalRuntimeClasspath
        ].collectMany { configuration -> configuration.resolve() as List<File> }
        def modFiles = runtimeFiles
                .findAll(isDistributableMod)
                .unique { it.canonicalPath }
                .sort { left, right -> left.name <=> right.name }
        def names = new HashSet<String>()
        modFiles.each { source ->
            if (!names.add(source.name)) {
                throw new GradleException("Duplicate runtime mod file name: ${source.name}")
            }
            copy {
                from source
                into modsDirectory
            }
        }
        copy {
            from releaseJarFile
            into modsDirectory
        }

        if (file('run/options.txt').isFile()) {
            copy {
                from 'run/options.txt'
                into overrides
            }
        }
        if (file('run/config').isDirectory()) {
            copy {
                from 'run/config'
                into new File(overrides, 'config')
            }
        }
        if (file('run/journeymap/config').isDirectory()) {
            copy {
                from 'run/journeymap/config'
                into new File(overrides, 'journeymap/config')
            }
        }

        copy {
            from 'src/main/resources/assets/zinecraft/icon.png'
            into new File(overrides, 'PCL')
            rename { 'Logo.png' }
        }
        new File(overrides, 'PCL/Setup.ini').setText(
                'Logo=PCL\\Logo.png\r\nLogoCustom=True\r\n', 'UTF-8')
        new File(overrides, 'README-Zinecraft.txt').setText(
                'Zinecraft requires Java 21. Allocate at least 6 GB of memory.\r\n'
                        + 'This pack preserves the project client options, key bindings, mod configs, '
                        + 'and JourneyMap display settings captured at packaging time.\r\n', 'UTF-8')

        def manifest = [
                minecraft      : [
                        version   : project.minecraft_version,
                        modLoaders: [[id: "neoforge-${project.neo_version}", primary: true]]
                ],
                manifestType   : 'minecraftModpack',
                manifestVersion: 1,
                name           : "Zinecraft ${project.mod_version}",
                version        : project.mod_version,
                author         : 'z8z6z8z6, Ye_xingchen',
                files          : [],
                overrides      : 'overrides'
        ]
        new File(stage, 'manifest.json').setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator(), 'UTF-8')
        if (file('LICENSE').isFile()) {
            copy {
                from 'LICENSE'
                into stage
                rename { 'LICENSE-Zinecraft.txt' }
            }
        }
        new File(stage, 'THIRD_PARTY_MODS.md').setText(
                '# Bundled runtime mods\n\n'
                        + 'The following files are redistributed runtime dependencies. '
                        + 'Their respective authors and licenses remain authoritative.\n\n'
                        + modFiles.collect { "- ${it.name}" }.join('\n')
                        + '\n', 'UTF-8')
    }
}

tasks.register('packagePcl', Zip) {
    group = 'distribution'
    description = 'Builds a PCL-importable Zinecraft pack and snapshots current client configuration.'
    dependsOn tasks.named('preparePclPackage')
    archiveFileName = pclArchive.map { it.asFile.name }
    destinationDirectory = pclArchive.map { it.asFile.parentFile }
    from pclStageDirectory
    doFirst {
        def output = archiveFile.get().asFile
        if (output.exists() && !providers.gradleProperty('overwritePcl').isPresent()) {
            throw new GradleException(
                    "PCL archive already exists: ${output}. Delete it or pass -PoverwritePcl=true.")
        }
    }
}

tasks.register('verifyPclPackage') {
    group = 'verification'
    description = 'Validates the PCL archive layout, required config snapshots, and ZIP integrity.'
    dependsOn tasks.named('packagePcl')

    doLast {
        def archive = tasks.named('packagePcl', Zip).get().archiveFile.get().asFile
        new ZipFile(archive).withCloseable { zip ->
            [
                    'manifest.json',
                    'overrides/options.txt',
                    'overrides/journeymap/config/6.0/journeymap.fullmap.config',
                    'overrides/journeymap/config/6.0/journeymap.minimap.config',
                    "overrides/mods/zinecraft-${project.mod_version}.jar"
            ].each { path ->
                if (zip.getEntry(path) == null) throw new GradleException("Missing PCL entry: ${path}")
            }
            zip.entries().each { entry ->
                if (!entry.directory && entry.size != 0) {
                    zip.getInputStream(entry).withCloseable { stream ->
                        stream.transferTo(OutputStream.nullOutputStream())
                    }
                }
            }
        }
        def digest = MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
        logger.lifecycle("PCL archive: ${archive.absolutePath}")
        logger.lifecycle("PCL SHA-256: ${digest}")
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
