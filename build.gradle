def bundleRuntimeMods = providers.gradleProperty('bundleRuntimeMods').map { value ->
    if (value.equalsIgnoreCase('true')) return true
    if (value.equalsIgnoreCase('false')) return false
    throw new GradleException("bundleRuntimeMods must be true or false, got: ${value}")
}.orElse(true)
def pclPackageName = bundleRuntimeMods.map { bundled ->
    "Zinecraft-PCL-${project.mod_version}${bundled ? '' : '-thin'}"
}
def pclStageDirectory = layout.buildDirectory.dir(pclPackageName.map { "pcl/${it}" })
def pclArchive = layout.buildDirectory.file(pclPackageName.map { "distributions/${it}.zip" })
def clientPackDirectory = layout.projectDirectory.dir('src/client-pack')

tasks.register('installClientPack', Copy) {
    group = 'distribution'
    description = 'Installs the source-controlled client pack into the development run directory.'
    from clientPackDirectory
    into layout.projectDirectory.dir('run')
}

tasks.named('prepareClientRun') {
    dependsOn tasks.named('installClientPack')
}

tasks.register('preparePclPackage') {
    group = 'distribution'
    description = 'Stages a PCL-compatible pack with the source-controlled client configuration.'
    dependsOn tasks.named('build')
    outputs.dir(pclStageDirectory)
    inputs.dir(clientPackDirectory)
    inputs.property('bundleRuntimeMods', bundleRuntimeMods)
    outputs.upToDateWhen { false }

    doLast {
        def stage = pclStageDirectory.get().asFile
        delete stage
        def overrides = new File(stage, 'overrides')
        def modsDirectory = new File(overrides, 'mods')
        modsDirectory.mkdirs()

        def isDistributableMod = { File candidate ->
            if (!candidate.isFile() || !candidate.name.toLowerCase(Locale.ROOT).endsWith('.jar')) return false
            def lowerName = candidate.name.toLowerCase(Locale.ROOT)
            if (lowerName.startsWith('neoforge-')
                    || lowerName.startsWith('loader-')
                    || lowerName.startsWith('earlydisplay-')
                    || lowerName.contains('client-extra')
                    || lowerName.startsWith('minecraft-')
                    || lowerName.startsWith('devlaunch-')) return false
            def accepted = false
            try {
                new ZipFile(candidate).withCloseable { zip ->
                    accepted = zip.getEntry('META-INF/neoforge.mods.toml') != null
                            || zip.getEntry('META-INF/mods.toml') != null
                    if (!accepted) {
                        def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
                        if (manifestEntry != null) {
                            zip.getInputStream(manifestEntry).withCloseable { stream ->
                                def type = new Manifest(stream).mainAttributes.getValue('FMLModType')
                                accepted = type in ['GAMELIBRARY', 'LIBRARY']
                            }
                        }
                    }
                }
            } catch (Exception ignored) {
                accepted = false
            }
            return accepted
        }

        def readableRuntimeNames = [
                'aC3cM3Vq-9I21YYxf.jar'        : 'mouse-tweaks-2.26.1.jar',
                'Adega8YN-PQzuABde.jar'        : 'target-dummy-1.21-2.1.0.jar',
                'EsAfCjCV-uAKA6Laj.jar'        : 'appleskin-3.0.9+mc1.21.jar',
                'RV1qfVQ8-hIJ2Ev1Q.jar'        : 'explorers-compass-1.21.1-3.4.0-neoforge.jar',
                'bookshelf-lib-1sdJl7J1.jar'   : 'bookshelf-21.1.81.jar',
                'fancymenu-AawWP7d6.jar'       : 'fancymenu-3.9.7.jar',
                'fPetb5Kh-nFniEtJV.jar'        : 'natures-compass-1.21.1-3.4.0-neoforge.jar',
                'konkrete-stJDU839.jar'         : 'konkrete-1.9.9.jar',
                'melody-efcdRVZP.jar'           : 'melody-1.0.10.jar',
                'prickle-EE1FHDyD.jar'          : 'prickle-21.1.11.jar',
                'sodium-S3DUMfBo.jar'           : 'sodium-0.8.12+mc1.21.1.jar',
                'tips-dFBz1Le7.jar'             : 'tips-21.1.3.jar',
                'tooltip-overhaul-dJSHREVC.jar' : 'tooltip-overhaul-1.5.1.jar',
                'twkfQtEc-3FbHoZqL.jar'         : 'moonlight-1.21.1-3.4.1.jar',
                'uEfK2CXF-TgNFki8j.jar'         : 'just-enough-resources-1.6.0.17.jar'
        ]
        def packagedRuntimeName = { File source -> readableRuntimeNames.getOrDefault(source.name, source.name) }

        def runtimeConfigurations = [
                configurations.runtimeClasspath,
                configurations.clientRuntimeRuntimeClasspath,
                configurations.clientLegacyClasspath
        ]
        def runtimeArtifacts = runtimeConfigurations.collectMany { configuration ->
            configuration.incoming.artifacts.artifacts as List
        }
        def componentByPath = runtimeArtifacts.collectEntries { artifact ->
            [(artifact.file.canonicalPath): artifact.id.componentIdentifier.displayName]
        }
        def runtimeFiles = runtimeArtifacts.collect { artifact -> artifact.file }
        def modFiles = runtimeFiles
                .findAll(isDistributableMod)
                .unique { it.canonicalPath }
                .sort { left, right -> left.name <=> right.name }
        def shouldBundleRuntimeMods = bundleRuntimeMods.get()
        def names = new HashSet<String>()
        modFiles.each { source ->
            def packagedName = packagedRuntimeName(source)
            if (!names.add(packagedName)) {
                throw new GradleException("Duplicate runtime mod file name: ${packagedName}")
            }
            if (shouldBundleRuntimeMods) {
                copy {
                    from source
                    into modsDirectory
                    rename { packagedName }
                }
            }
        }
        copy {
            from releaseJarFile
            into modsDirectory
        }

        if (clientPackDirectory.asFile.isDirectory()) {
            copy {
                from clientPackDirectory
                into overrides
            }
        }

        copy {
            from 'src/main/resources/assets/zinecraft/icon.png'
            into new File(overrides, 'PCL')
            rename { 'Logo.png' }
        }
        new File(overrides, 'PCL/Setup.ini').setText(
                'Logo=PCL\\Logo.png\r\nLogoCustom=True\r\n', 'UTF-8')
        new File(overrides, 'README-Zinecraft.txt').setText(
                'Zinecraft requires Java 21. Allocate at least 6 GB of memory.\r\n'
                        + 'This pack installs the project client options, key bindings, mod configs, '
                        + 'and JourneyMap display settings maintained in source control.\r\n'
                        + (shouldBundleRuntimeMods
                        ? 'Runtime dependency JARs are bundled in the mods directory.\r\n'
                        : 'Runtime dependency JARs are not bundled. Install every entry in runtime-dependencies.json before launching.\r\n'),
                'UTF-8')

        def manifest = [
                minecraft      : [
                        version   : project.minecraft_version,
                        modLoaders: [[id: "neoforge-${project.neo_version}", primary: true]]
                ],
                manifestType   : 'minecraftModpack',
                manifestVersion: 1,
                name           : "Zinecraft ${project.mod_version}",
                version        : project.mod_version,
                author         : 'z8z6z8z6, Ye_xingchen',
                files          : [],
                overrides      : 'overrides'
        ]
        new File(stage, 'manifest.json').setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + System.lineSeparator(), 'UTF-8')
        def runtimeDependencies = [
                schemaVersion    : 1,
                bundleRuntimeMods: shouldBundleRuntimeMods,
                dependencies     : modFiles.collect { source ->
                    [
                            component: componentByPath[source.canonicalPath],
                            file     : packagedRuntimeName(source),
                            bundled  : shouldBundleRuntimeMods
                    ]
                }
        ]
        new File(stage, 'runtime-dependencies.json').setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(runtimeDependencies)) + System.lineSeparator(), 'UTF-8')
        if (file('LICENSE').isFile()) {
            copy {
                from 'LICENSE'
                into stage
                rename { 'LICENSE-Zinecraft.txt' }
            }
        }
        new File(stage, 'THIRD_PARTY_MODS.md').setText(
                '# Runtime mod dependencies\n\n'
                        + (shouldBundleRuntimeMods
                        ? 'The following runtime dependencies are bundled in overrides/mods/.\n\n'
                        : 'The following runtime dependencies are required but not bundled. Install them manually before launching.\n\n')
                        + 'Their respective authors and licenses remain authoritative.\n\n'
                        + '## Client menu and loading tips\n\n'
                        + '- FancyMenu 3.9.7 — DSMSLv3.1 — https://modrinth.com/mod/fancymenu\n'
                        + '- Melody 1.0.10 — MIT — https://modrinth.com/mod/melody\n'
                        + '- Konkrete 1.9.9 — Apache-2.0 — https://modrinth.com/mod/konkrete\n'
                        + '- Tips 21.1.3 — LGPL-2.1-only — https://modrinth.com/mod/tips\n'
                        + '- Bookshelf 21.1.81 — LGPL-2.1-only — https://modrinth.com/mod/bookshelf-lib\n'
                        + '- Prickle 21.1.11 — LGPL-2.1-only — https://modrinth.com/mod/prickle\n\n'
                        + '## Packaged files\n\n'
                        + modFiles.collect { "- ${packagedRuntimeName(it)}" }.join('\n')
                        + '\n', 'UTF-8')
    }
}

tasks.register('packagePcl', Zip) {
    group = 'distribution'
    description = 'Builds a PCL-importable Zinecraft pack from source-controlled client configuration.'
    dependsOn tasks.named('preparePclPackage')
    archiveFileName = pclArchive.map { it.asFile.name }
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from pclStageDirectory
    doFirst {
        def output = archiveFile.get().asFile
        if (output.exists() && !providers.gradleProperty('overwritePcl').isPresent()) {
            throw new GradleException(
                    "PCL archive already exists: ${output}. Delete it or pass -PoverwritePcl=true.")
        }
    }
}

tasks.register('verifyPclPackage') {
    group = 'verification'
    description = 'Validates the PCL archive layout, required client configuration, and ZIP integrity.'
    dependsOn tasks.named('packagePcl')

    doLast {
        def archive = tasks.named('packagePcl', Zip).get().archiveFile.get().asFile
        new ZipFile(archive).withCloseable { zip ->
            [
                    'manifest.json',
                    'runtime-dependencies.json',
                    'overrides/options.txt',
                    'overrides/journeymap/config/6.0/journeymap.fullmap.config',
                    'overrides/journeymap/config/6.0/journeymap.minimap.config',
                    "overrides/mods/zinecraft-${project.mod_version}.jar"
            ].each { path ->
                if (zip.getEntry(path) == null) throw new GradleException("Missing PCL entry: ${path}")
            }
            def dependencyEntry = zip.getEntry('runtime-dependencies.json')
            def dependencyManifest = zip.getInputStream(dependencyEntry).withCloseable { stream ->
                new JsonSlurper().parse(new InputStreamReader(stream, 'UTF-8'))
            }
            def shouldBundleRuntimeMods = bundleRuntimeMods.get()
            if (dependencyManifest.bundleRuntimeMods != shouldBundleRuntimeMods) {
                throw new GradleException('Runtime dependency manifest mode does not match bundleRuntimeMods')
            }
            def expectedRuntimeMods = dependencyManifest.dependencies.collect { it.file as String }.toSet()
            def packagedRuntimeMods = zip.entries().findAll { entry ->
                !entry.directory
                        && entry.name.startsWith('overrides/mods/')
                        && entry.name.endsWith('.jar')
                        && entry.name != "overrides/mods/zinecraft-${project.mod_version}.jar"
            }.collect { entry -> entry.name.substring('overrides/mods/'.length()) }.toSet()
            def expectedPackagedMods = shouldBundleRuntimeMods ? expectedRuntimeMods : [] as Set
            if (packagedRuntimeMods != expectedPackagedMods) {
                throw new GradleException(
                        "Packaged runtime mods do not match dependency manifest: expected=${expectedPackagedMods}, actual=${packagedRuntimeMods}")
            }
            zip.entries().each { entry ->
                if (!entry.directory && entry.size != 0) {
                    zip.getInputStream(entry).withCloseable { stream ->
                        stream.transferTo(OutputStream.nullOutputStream())
                    }
                }
            }
        }
        def digest = MessageDigest.getInstance('SHA-256').digest(archive.bytes).encodeHex().toString()
        logger.lifecycle("PCL archive: ${archive.absolutePath}")
        logger.lifecycle("Runtime dependencies bundled: ${bundleRuntimeMods.get()}")
        logger.lifecycle("PCL SHA-256: ${digest}")
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
