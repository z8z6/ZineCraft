modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/z8z6/ZineCraft"
logoFile = "assets/zinecraft/icon.png"
authors = "z8z6, YeXingChenAWA"
description = '''
Zinecraft mod.
'''

[[mixins]]
config = "zinecraft.client.mixins.json"

[[dependencies.${ mod_id }]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "terrablender"
type = "required"
versionRange = "[4.1.0.8,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "ponder"
type = "required"
versionRange = "[1.0.69,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${ mod_id }]]
modId = "ftbquests"
type = "required"
versionRange = "[2101.1.20,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${ mod_id }]]
modId = "curios"
type = "required"
versionRange = "[9.5.1,)"
ordering = "AFTER"
side = "BOTH"
